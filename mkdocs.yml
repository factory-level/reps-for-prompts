# RFP documentation — human guide, as-built architecture and design.
# Local preview: uvx --with mkdocs-material mkdocs serve
site_name: RFP
site_description: "Reps for prompts: exercise while your coding agent thinks."
docs_dir: docs
hooks:
  - docs_tools/links.py

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: wiki/index.md
  - Concepts:
      - The big picture: wiki/concepts/big-picture.md
      - The loop: wiki/concepts/the-loop.md
      - Daily routine: wiki/concepts/weekly-goals.md
      - Counting your reps: wiki/concepts/detection.md
      - Remembering your progress: wiki/concepts/storage.md
  - Reference:
      - Debug mode: wiki/debug-mode.md
      - Configuration: wiki/reference/config.md
      - Adding and tuning movements: wiki/reference/adding-exercises.md
      - Development commands: wiki/reference/cli.md
      - Module map: wiki/reference/modules.md
  - About:
      - Roadmap: wiki/about/roadmap.md
      - Glossary: wiki/about/glossary.md
  - Architecture:
      - As built: architecture/index.md
      - Detection and sensitivity: architecture/detection.md
      - Multi-camera consensus: architecture/consensus.md
      - Dogfood setup and limits: production/rfp-dogfood.md
  - Design:
      - Intent: design/index.md
      - Multi-camera consensus: design/multi-camera-consensus.md
      - Workout debt desktop (spec): superpowers/specs/2026-08-31-workout-debt-desktop.md
